<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALMAI Chat</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --brand: #1565c0;
      --user-bubble: #e3f2fd;
      --user-text: #0d47a1;
      --bot-bubble: #f1f3f5;
      --text: #1f2933;
      --muted: #8a94a6;
      --border: #e3e8ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 820px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      box-shadow: 0 0 24px rgba(0, 0, 0, .06);
    }
    header {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .9rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }
    header .logo { width: 30px; height: 30px; color: var(--brand); }
    header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    header .sub { margin-left: auto; font-size: .8rem; color: var(--muted); }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
    }
    .msg {
      display: flex;
      align-items: flex-end;
      gap: .55rem;
      max-width: 85%;
    }
    .msg.me { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }

    .avatar {
      flex: 0 0 auto;
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      color: var(--brand);
    }
    .msg.me .avatar { background: var(--brand); color: #fff; }
    .avatar svg { width: 18px; height: 18px; }

    .bubble {
      padding: .6rem .85rem;
      border-radius: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: .94rem;
    }
    .msg.me .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: var(--user-text);
    }
    .msg.bot .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
    }
    .tool { max-width: 94%; }
    .tool .bubble {
      background: #fff8e1;
      border: 1px solid #ffe9a8;
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: .8rem;
      color: #6b5b00;
      white-space: pre-wrap;
    }

    .typing .bubble { display: flex; gap: 5px; align-items: center; }
    .typing .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing .dot:nth-child(2) { animation-delay: .2s; }
    .typing .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .2; }
      40% { opacity: 1; }
    }

    footer {
      display: flex;
      gap: .6rem;
      padding: .8rem 1.2rem;
      border-top: 1px solid var(--border);
    }
    #msg {
      flex: 1;
      padding: .7rem .9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: .95rem;
      outline: none;
    }
    #msg:focus { border-color: var(--brand); }
    button {
      padding: .7rem 1.3rem;
      border: none;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font-size: .95rem;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/>
      </svg>
      <h1>ALMAI Financial Data Chat</h1>
      <span class="sub">Demo</span>
    </header>

    <div id="log"></div>

    <footer>
      <input id="msg" placeholder="e.g. Base NII for bank -48858 on 2026-06-30"
             autocomplete="off" onkeydown="if(event.key==='Enter')send()">
      <button id="sendBtn" onclick="send()">Send</button>
    </footer>
  </div>

  <script>
    const log = document.getElementById('log');
    const input = document.getElementById('msg');
    const sendBtn = document.getElementById('sendBtn');
    let history = [];

    const ICON_BOT =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="4" y="8" width="16" height="11" rx="2"/><path d="M12 8V4"/>' +
      '<circle cx="12" cy="3" r="1"/><path d="M2 13v2"/><path d="M22 13v2"/>' +
      '<circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/></svg>';
    const ICON_USER =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round">' +
      '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';

    function appendRow(side, extraCls, text) {
      const row = document.createElement('div');
      row.className = 'msg ' + side + (extraCls ? ' ' + extraCls : '');
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerHTML = side === 'me' ? ICON_USER : ICON_BOT;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.appendChild(avatar);
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    function addUser(text) { return appendRow('me', '', 'You: ' + text); }
    function addBot(text) { return appendRow('bot', '', text); }
    function addTool(text) { return appendRow('bot', 'tool', text); }

    function addThinking() {
      const row = document.createElement('div');
      row.className = 'msg bot typing';
      row.innerHTML =
        '<div class="avatar">' + ICON_BOT + '</div>' +
        '<div class="bubble"><span class="dot"></span>' +
        '<span class="dot"></span><span class="dot"></span></div>';
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      addUser(text);
      input.value = '';
      sendBtn.disabled = true;

      const thinking = addThinking();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history })
        });
        const data = await res.json();
        thinking.remove();
        for (const c of (data.calls || [])) {
          addTool('→ call: ' + JSON.stringify(c.request) +
                  '\n← result: ' + JSON.stringify(c.result, null, 2));
        }
        addBot(data.reply || '(no reply)');
        history.push({ role: 'user', content: text });
        history.push({ role: 'assistant', content: data.reply || '' });
      } catch (e) {
        thinking.remove();
        addBot('Error: ' + e.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }
  </script>
</body>
</html>
