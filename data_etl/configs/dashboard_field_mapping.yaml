# Source-to-target field mapping for the Dashboard dataset.
# Group attributes are inherited by every field in the group.
source_dataset: dashboard

groups:
  - domain: "Banking Context"
    subcategory: "Base Information"
    target_table: core.bank_snapshot
    mapping: direct
    dimension: "bank/date"
    fields:
      - {dev_field: ID, source_alias: d, target_column: dashboard_source_id, pg_type: BIGINT, confidence: high, notes: "Dev Dashboard raw row ID, not bank_id"}
      - {dev_field: BankID, source_alias: w, target_column: bank_id, pg_type: BIGINT, confidence: high, notes: "Original bank ID; stored directly"}
      - {dev_field: asof, source_alias: w, target_column: as_of_date, pg_type: DATE, confidence: high, notes: "YYYYMMDD integer converted to PostgreSQL DATE"}
  - domain: "Credit & Asset Quality"
    subcategory: "Loss Provision"
    target_table: risk.asset_quality
    mapping: direct
    dimension: "bank/date"
    source_alias: d
    pg_type: NUMERIC
    fields:
      - {dev_field: CECL, target_column: cecl, confidence: to_be_verified, notes: "CECL and ALLL must not be merged directly"}
      - {dev_field: LossRate, target_column: loss_rate, confidence: to_be_verified, notes: "Loss rate denominator and measurement period to be confirmed"}
      - {dev_field: ALLL, target_column: alll, confidence: to_be_verified, notes: "ALLL and CECL must not be merged directly"}
  - domain: "Profitability"
    subcategory: "Profitability Indicators"
    target_table: finance.earnings
    mapping: direct
    dimension: "bank/date"
    source_alias: d
    pg_type: NUMERIC
    fields:
      - {dev_field: Margin, target_column: margin, confidence: to_be_verified, notes: "Margin definition, measurement period and unit need confirmation"}
      - {dev_field: ROA, target_column: roa, confidence: high}
      - {dev_field: ROE, target_column: roe, confidence: high}
      - {dev_field: NonIntCost, target_column: non_int_cost, confidence: high}
      - {dev_field: EffMgnTax, target_column: eff_mgn_tax, confidence: to_be_verified, notes: "Tax rate / margin caliber and unit to be confirmed"}
      - {dev_field: NonII, target_column: non_ii, confidence: to_be_verified, notes: "NonII name/caliber needs Dev confirmation"}
      - {dev_field: NonIC, target_column: non_ic, confidence: to_be_verified, notes: "NonIC name/caliber needs Dev confirmation"}
      - {dev_field: ROAEx, target_column: roa_ex, confidence: high}
      - {dev_field: ROEEx, target_column: roe_ex, confidence: high}
  - domain: "Liquidity Risk"
    subcategory: "Liquidity Indicators"
    target_table: risk.liquidity
    mapping: direct
    dimension: "bank/date"
    source_alias: d
    pg_type: NUMERIC
    fields:
      - {dev_field: ST2Asset, target_column: st2asset, confidence: high}
      - {dev_field: STI2Asset, target_column: sti2asset, confidence: to_be_verified, notes: "Abbreviation STI caliber to be confirmed"}
      - {dev_field: NLL2Asset, target_column: nll2asset, confidence: to_be_verified, notes: "Abbreviation NLL caliber to be confirmed"}
      - {dev_field: LCR, target_column: lcr, confidence: high}
  - domain: "Funding Source"
    subcategory: "Funding Structure"
    target_table: finance.funding
    mapping: direct
    dimension: "bank/date"
    source_alias: d
    pg_type: NUMERIC
    fields:
      - {dev_field: Loan2Deposit, target_column: loan2deposit, confidence: high}
      - {dev_field: NLL2Deposit, target_column: nll2deposit, confidence: to_be_verified, notes: "Abbreviation NLL caliber to be confirmed"}
      - {dev_field: NLL2CoreDeposit, target_column: nll2coredeposit, confidence: to_be_verified, notes: "Abbreviation NLL caliber to be confirmed"}
      - {dev_field: NetNonCoreFundingDependence, target_column: net_noncore_funding_dependence, confidence: high}
      - {dev_field: FundingCost, target_column: funding_cost, confidence: high}
  - domain: "Interest Rate Risk"
    subcategory: "Interest Rate Risk Rollup"
    target_table: risk.interest_rate_risk
    mapping: direct
    dimension: "bank/date"
    source_alias: d
    pg_type: NUMERIC
    fields:
      - {dev_field: GapRatio, target_column: gap_ratio, confidence: to_be_verified, notes: "GapRatio and GapRatios_Base are not necessarily equal; do not merge"}
      - {dev_field: YieldCurveRisk, target_column: yield_curve_risk, confidence: high}
      - {dev_field: OptionRisk, target_column: option_risk, confidence: high}
      - {dev_field: BasisRisk, target_column: basis_risk, confidence: high}
      - {dev_field: StressEVE, target_column: stress_eve, confidence: high}
      - {dev_field: StressDynamicGap, target_column: stress_dynamic_gap, confidence: high}
      - {dev_field: StressNII12, target_column: stress_nii12, confidence: high}
      - {dev_field: StressEfficiencyRatio, target_column: stress_efficiency_ratio, confidence: high}
      - {dev_field: KRD_KRD3M, target_column: krd_3m, confidence: high}
      - {dev_field: KRD_KRD1Y, target_column: krd_1y, confidence: high}
      - {dev_field: KRD_KRD3Y, target_column: krd_3y, confidence: high}
      - {dev_field: KRD_KRD5Y, target_column: krd_5y, confidence: high}
      - {dev_field: KRD_KRD7Y, target_column: krd_7y, confidence: high}
      - {dev_field: KRD_KRD10Y, target_column: krd_10y, confidence: high}
      - {dev_field: KRD_KRD20Y, target_column: krd_20y, confidence: high}
      - {dev_field: KRD_KRD30Y, target_column: krd_30y, confidence: high}
      - {dev_field: NCUA_BaseEVERatio, target_column: ncua_base_eve_ratio, confidence: high}
      - {dev_field: NCUA_U300EVERatio, target_column: ncua_u300_eve_ratio, confidence: high}
      - {dev_field: NCUA_Duration, target_column: ncua_duration, confidence: high}
      - {dev_field: GapAssetNonsens, target_column: gap_asset_nonsens, confidence: to_be_verified, notes: "Field name contains Nonsens; needs explicit Dev definition; tentatively classified under interest-rate-risk model indicators"}
  - domain: "Capital"
    subcategory: "Capital & Leverage"
    target_table: finance.capital
    mapping: direct
    dimension: "bank/date"
    source_alias: d
    pg_type: NUMERIC
    fields:
      - {dev_field: Tier1, target_column: tier1, confidence: high}
      - {dev_field: Tier1Ratio, target_column: tier1_ratio, confidence: high}
      - {dev_field: Tier1RiskBasedRatio, target_column: tier1_risk_based_ratio, confidence: high}
      - {dev_field: TotalRiskBasedRatio, target_column: total_risk_based_ratio, confidence: high}
      - {dev_field: Leverage, target_column: leverage, confidence: high}
      - {dev_field: LeverageAsset, target_column: leverage_asset, confidence: to_be_verified, notes: "Whether LeverageAsset is a denominator or base asset to be confirmed"}
