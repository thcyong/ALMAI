  - schema: finance
    domain: Balance Sheet Structure
    table: finance.balance_sheet_sector
    subcategory: Sector Detail Rollup
    grain: sector_rows
    dimension: sector_code
    values:
      sector_value: NUMERIC
      sector_face: NUMERIC
      sector_duration: NUMERIC
      sector_gap_ratio: NUMERIC
      sector_rate: NUMERIC

  - schema: risk
    domain: Interest Rate Risk
    table: risk.interest_rate_risk
