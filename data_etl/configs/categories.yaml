      stress_eve: NUMERIC
      stress_dynamic_gap: NUMERIC
      stress_nii12: NUMERIC
      stress_efficiency_ratio: NUMERIC
      ncua_base_eve_ratio: NUMERIC
      ncua_u300_eve_ratio: NUMERIC
      ncua_duration: NUMERIC
      krd_3m: NUMERIC
      krd_1y: NUMERIC
      krd_3y: NUMERIC
      krd_5y: NUMERIC
      krd_7y: NUMERIC
      krd_10y: NUMERIC
      krd_20y: NUMERIC
      krd_30y: NUMERIC
      gap_asset_nonsens: NUMERIC

  - schema: risk
    domain: Interest Rate Risk
    table: risk.interest_rate_scenario
    subcategory: Interest Rate Scenario Results
    grain: scenario_rows
    dimension: scenario_code
    values:
      roe: NUMERIC
      gap_ratio: NUMERIC
