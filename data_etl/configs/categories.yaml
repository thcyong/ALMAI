views:
  - name: risk.bank_base_nii_eve
    sql: |
      CREATE OR REPLACE VIEW risk.bank_base_nii_eve AS
      SELECT bank_id, as_of_date, nii, eve, updated_at
      FROM risk.interest_rate_scenario
      WHERE scenario_code = 'Base'
