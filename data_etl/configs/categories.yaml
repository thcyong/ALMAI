# Classification registry: single source of truth for AI-database targets.
#
# Hierarchy: schema (L1 big category) -> domain (business group) ->
#            table (L2 small category, tagged with subcategory).
#
# Adding a table or a value column here is all that is needed: schemas, target
# tables, writer columns and views are derived from this file at import time.
# Removing objects is intentionally NOT automated (non-destructive).

# Dataset that owns these tables. A different owner_dataset value in a new
# category entry is allowed and is enforced by the writer.
owner_dataset: dashboard

# Writer grains and their mapping strategies. Adding a new grain/strategy pair
# here is enough; no Python change is needed.
grains:
  - name: single_row
    strategy: direct
  - name: scenario_rows
    strategy: scenario_unpivot
  - name: sector_rows
    strategy: sector_unpivot

# Source as-of date storage formats. Kinds: datetime, date, iso, strftime
# (with 'format' and optional 'cast': str|int); 'range: true' allows backfill.
date_formats:
  datetime: {kind: datetime, range: true}
  date: {kind: date, range: true}
  yyyymmdd_int: {kind: strftime, format: "%Y%m%d", cast: int, range: false}
  yyyymmdd_text: {kind: strftime, format: "%Y%m%d", cast: str, range: false}
  iso_text: {kind: iso, range: false}

categories:
  - schema: core
    domain: Banking Context
    table: core.bank_snapshot
    subcategory: Base Information
    grain: single_row
    values:
      dashboard_source_id: BIGINT

  - schema: finance
    domain: Profitability
    table: finance.earnings
    subcategory: Profitability Indicators
    grain: single_row
    values:
      margin: NUMERIC
      roa: NUMERIC
      roe: NUMERIC
      non_ii: NUMERIC
      non_ic: NUMERIC
      non_int_cost: NUMERIC
      eff_mgn_tax: NUMERIC
      roa_ex: NUMERIC
      roe_ex: NUMERIC

  - schema: finance
    domain: Funding Source
    table: finance.funding
    subcategory: Funding Structure
    grain: single_row
    values:
      loan2deposit: NUMERIC
      nll2deposit: NUMERIC
      nll2coredeposit: NUMERIC
      net_noncore_funding_dependence: NUMERIC
      funding_cost: NUMERIC

  - schema: finance
    domain: Capital
    table: finance.capital
    subcategory: Capital & Leverage
    grain: single_row
    values:
      tier1: NUMERIC
      tier1_ratio: NUMERIC
      tier1_risk_based_ratio: NUMERIC
      total_risk_based_ratio: NUMERIC
      leverage: NUMERIC
      leverage_asset: NUMERIC

  - schema: risk
    domain: Liquidity Risk
    table: risk.liquidity
    subcategory: Liquidity Indicators
    grain: single_row
    values:
      st2asset: NUMERIC
      sti2asset: NUMERIC
      nll2asset: NUMERIC
