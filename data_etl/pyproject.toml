[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-dashboard-etl"
version = "0.1.0"
description = "Read-only SQL Server to PostgreSQL financial metric synchronization"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy>=2.0,<2.1",
  "pyodbc>=5.1,<6",
  "psycopg[binary]>=3.1,<4",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2"
]

[tool.setuptools.packages.find]
where = ["src"]
